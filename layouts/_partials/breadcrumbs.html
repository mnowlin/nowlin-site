<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ site.Home.RelPermalink }}">{{ i18n "label_home" }}</a></li>
    {{- if and .IsPage (in (slice "publication" "talk") .Section) }}
      <li><a href="{{ "publication/" | relURL }}{{ if eq .Section "talk" }}#presentations{{ end }}">Writings</a></li>
    {{- else if and .IsPage .Parent (not .Parent.IsHome) }}
      <li><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></li>
    {{- end }}
    <li aria-current="page">{{ .Title | markdownify }}</li>
  </ol>
</nav>
