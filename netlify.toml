[build]
  publish = "docs"
  command = "wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.tar.gz && mkdir -p $HOME/quarto && tar -xzf quarto-1.9.37-linux-amd64.tar.gz -C $HOME/quarto --strip-components=1 && export PATH=$HOME/quarto/bin:$PATH && quarto render"
