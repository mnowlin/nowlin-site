# Alternative to GitHub Pages: your domain currently points at Netlify. If you keep Netlify,
# this builds the same site there. Use one host or the other, not both.
[build]
  publish = "public"
  command = "npm ci && hugo --gc --minify && npx pagefind --site public"
[build.environment]
  HUGO_VERSION = "0.148.2"
  NODE_VERSION = "22"
